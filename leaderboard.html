<!doctype html>
<html lang="cs">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Piškvorky – Historie výsledků</title>
        <link rel="icon" href="favicon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <nav>
            <a href="index.html">🎮 Hra</a>
            <a href="leaderboard.html" class="active">🏆 Historie</a>
            <a href="rules.html">📖 Pravidla</a>
        </nav>

        <main>
            <h1>Historie výsledků</h1>
            <p class="subtitle">Výsledky jsou uloženy v tomto prohlížeči</p>

            <div class="game-buttons" style="margin-bottom: 1rem">
                <button class="btn btn-sm btn-ghost" onclick="clearHistory()">
                    🗑️ Smazat historii
                </button>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Datum a čas</th>
                            <th>Hráč X</th>
                            <th>Hráč O</th>
                            <th>Výsledek</th>
                        </tr>
                    </thead>
                    <tbody id="history-body"></tbody>
                </table>
                <p class="empty-msg" id="empty-msg" style="display: none">
                    Zatím žádné výsledky. Zahraj si nejdřív nějakou hru! 🎮
                </p>
            </div>
        </main>

        <footer>Piškvorky - Kafka</footer>

        <script src="leaderboard.js"></script>
    </body>
</html>
